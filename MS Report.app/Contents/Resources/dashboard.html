<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS Report</title>
<style>
:root {
  color-scheme: light;
  --ink: #16191d; --muted: #5f6b76; --faint: #8b949e;
  --rule: #e3e6ea; --rule-strong: #cfd4da; --bg: #ffffff; --soft: #f6f7f9; --hover: #f1f4f8;
  --accent: #002a5c; --accent-2: #0b4a8f; --accent-soft: #e9eff7;
  --ok: #1a7f37; --ok-soft: #e7f4ea; --warn: #8a5a00; --warn-soft: #fff3d1; --bad: #b42318; --bad-soft: #fdeceb;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); }
body { display: flex; flex-direction: column; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-2); }

/* top bar */
header { display: flex; align-items: center; gap: 18px; padding: 10px 18px 0; border-bottom: 1px solid var(--rule); flex: none; }
.brand { font-weight: 650; letter-spacing: .01em; font-size: 14px; padding-bottom: 10px; }
.folder { display: flex; align-items: baseline; gap: 8px; min-width: 0; padding-bottom: 10px; }
.folder b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 380px; }
.folder span { color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; font-size: 12px; }
nav { margin-left: auto; display: flex; gap: 2px; align-self: flex-end; }
nav button { border: 0; background: none; padding: 7px 12px 9px; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; }
nav button:hover { color: var(--ink); }
nav button.on { color: var(--ink); border-bottom-color: var(--accent); }
nav button .dot { display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: var(--accent-2); margin-left: 5px; vertical-align: 2px; }
nav button .count { color: var(--faint); font-weight: 400; margin-left: 4px; }

main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.page { flex: 1; min-height: 0; display: none; flex-direction: column; }
.page.on { display: flex; }

/* buttons */
.btn { border: 1px solid var(--rule-strong); background: #fff; border-radius: 6px; padding: 5px 11px; line-height: 18px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 550; }
.btn.primary:hover { background: var(--accent-2); }
.btn.big { padding: 8px 18px; font-size: 14px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; background: #fff; }
.btn.primary:disabled { background: var(--accent); }
.link { border: 0; background: none; color: var(--accent-2); padding: 0; }
.link:hover { text-decoration: underline; }

/* toolbar */
.toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--rule); flex: none; flex-wrap: wrap; }
.toolbar .grow { flex: 1; }
.search { border: 1px solid var(--rule-strong); border-radius: 6px; padding: 5px 9px; width: 220px; }
.search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent-2); }
.chips { display: flex; gap: 4px; }
.chip { border: 1px solid var(--rule); background: #fff; border-radius: 999px; padding: 3px 10px; color: var(--muted); font-size: 12px; }
.chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 550; }
.chip.bad.on { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
.saved { color: var(--faint); font-size: 12px; }
.bulk { display: none; align-items: center; gap: 8px; padding: 8px 18px; background: var(--accent-soft); border-bottom: 1px solid var(--rule); flex: none; flex-wrap: wrap; }
.bulk.on { display: flex; }
.bulk b { color: var(--accent); margin-right: 6px; }
.bulk label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 5px; }
.bulk select { border: 1px solid var(--rule-strong); border-radius: 5px; background: #fff; padding: 3px 6px; }

/* tables */
.scroll { flex: 1; min-height: 0; overflow: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th { position: sticky; top: 0; z-index: 2; background: #fff; text-align: left; font-weight: 550; color: var(--muted); font-size: 12px;
     padding: 7px 6px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
th[data-sort] { cursor: pointer; }
th[data-sort]:hover { color: var(--ink); }
td { padding: 3px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr:hover td { background: #fbfcfd; }
td.c, th.c { text-align: center; }
td.r, th.r { text-align: right; }
.num { color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 8px; text-align: right; }
.mono { font-family: var(--mono); font-size: 12px; }
#samplesTable { table-layout: fixed; min-width: 1330px; }
#samplesTable.all { min-width: 1930px; }
.cell { width: 100%; border: 1px solid transparent; background: transparent; border-radius: 4px; padding: 3px 5px; min-height: 26px; }
.cell:hover { border-color: var(--rule); }
.cell:focus { outline: none; border-color: var(--accent-2); background: #fff; box-shadow: 0 0 0 2px var(--accent-soft); }
select.cell { appearance: none; -webkit-appearance: none; padding-right: 18px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--faint) 50%), linear-gradient(135deg, var(--faint) 50%, transparent 50%);
  background-position: calc(100% - 9px) 11px, calc(100% - 5px) 11px; background-size: 4px 4px; background-repeat: no-repeat; }
.cell.err { border-color: var(--bad); background: var(--bad-soft); }
.cell.empty { color: var(--faint); }
.deltas { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info { font-size: 11.5px; color: var(--muted); padding: 1px 6px 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info .m { font-family: var(--mono); font-size: 11px; color: var(--ink); }
.info .e { color: var(--bad); }
.info .g { color: var(--warn); }
tr.rerr td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
tr.rskip td { color: var(--faint); }
tr.rskip td:first-child { box-shadow: inset 3px 0 0 var(--rule-strong); }
tr.rblank td { background: var(--soft); }
tr.sel td { background: var(--accent-soft) !important; }
input[type=checkbox] { accent-color: var(--accent); margin: 7px 0 0 4px; }

/* pills */
.pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 550; white-space: nowrap; }
.pill.yes { background: var(--ok-soft); color: var(--ok); }
.pill.weak { background: var(--warn-soft); color: var(--warn); }
.pill.no { background: var(--soft); color: var(--muted); }
.pill.blank { background: var(--soft); color: var(--muted); font-weight: 450; }

/* cards, empty states */
.center { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 56px 24px; }
.card { width: min(680px, 100%); }
.card h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
.card h2 { font-size: 13px; font-weight: 600; margin: 26px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.card p { color: var(--muted); margin: 0 0 16px; }
.recent { border-top: 1px solid var(--rule); }
.recent button { display: flex; width: 100%; text-align: left; gap: 12px; align-items: baseline; border: 0; border-bottom: 1px solid var(--rule); background: none; padding: 9px 4px; }
.recent button:hover { background: var(--hover); }
.recent b { font-weight: 550; }
.recent span { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facts { border-top: 1px solid var(--rule); margin: 0 0 18px; }
.facts div { display: flex; gap: 12px; padding: 7px 2px; border-bottom: 1px solid var(--rule); }
.facts dt { width: 150px; color: var(--muted); flex: none; }
.facts dd { margin: 0; }

/* run page */
.runpage { flex: 1; overflow: auto; padding: 22px 28px 40px; }
.runcols { display: grid; grid-template-columns: minmax(320px, 520px) minmax(300px, 1fr); gap: 34px; align-items: start; }
.section h3 { font-size: 13px; font-weight: 600; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 2px; border-bottom: 1px solid var(--rule); }
.opt:first-of-type { border-top: 1px solid var(--rule); }
.opt input { margin-top: 3px; accent-color: var(--accent); }
.opt small { display: block; color: var(--muted); }
.settings { display: grid; grid-template-columns: 1fr 90px; gap: 6px 12px; align-items: center; margin-top: 8px; }
.settings input { border: 1px solid var(--rule-strong); border-radius: 5px; padding: 4px 7px; text-align: right; width: 90px; }
.settings small { color: var(--faint); display: block; }
.warnbox { background: var(--bad-soft); border: 1px solid #f4c7c3; color: var(--bad); border-radius: 8px; padding: 10px 12px; margin: 12px 0; }
.okbox { background: var(--ok-soft); border: 1px solid #bfe2c8; border-radius: 8px; padding: 12px 14px; margin: 0 0 12px; }
.okbox b { color: var(--ok); }
.progress { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin: 10px 0 6px; }
.progress div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
pre.log { background: var(--soft); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; font: 11.5px/1.45 var(--mono);
          max-height: 46vh; overflow: auto; white-space: pre-wrap; margin: 10px 0 0; color: #33393f; }
details summary { cursor: pointer; color: var(--muted); margin-top: 10px; }

/* results */
.stats { display: flex; gap: 28px; padding: 14px 18px; border-bottom: 1px solid var(--rule); align-items: baseline; flex-wrap: wrap; flex: none; }
.stat b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); margin-left: 6px; }
.stats .grow { flex: 1; }
.detail td { background: #fcfcfd; padding: 14px 18px 18px; }
.detail .grid { display: grid; grid-template-columns: 260px 1fr; gap: 24px; }
.detail img { width: 260px; height: 220px; object-fit: contain; border: 1px solid var(--rule); border-radius: 8px; background: #fff; }
.detail h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.detail table { width: auto; margin-bottom: 14px; }
.detail table td, .detail table th { position: static; padding: 3px 10px 3px 0; font-size: 12px; border-bottom: 1px solid var(--rule); background: none; }
.detail p { margin: 0 0 12px; }
tr.clickable { cursor: pointer; }
#plots { margin-top: 18px; }
#plots canvas { width: 100%; height: 230px; display: block; cursor: crosshair; }
#plots .snote { margin: 10px 0 2px; }
.trunc { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* blocks */
#blocksTable { table-layout: fixed; min-width: 1360px; }
.errtext { color: var(--bad); font-size: 11.5px; }
.note { color: var(--muted); font-size: 12px; }

/* tabs that need a folder; Start only shows without one */
nav.nofolder button[data-tab=samples], nav.nofolder button[data-tab=run], nav.nofolder button[data-tab=results],
nav.nofolder button[data-tab=blocks], nav:not(.nofolder) button[data-tab=home] { display: none; }

/* mass calculator */
.masspage { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 400px) 1fr; }
.massin { padding: 18px 20px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: auto; }
.massin h3, .massout h3 { font-size: 13px; font-weight: 600; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
textarea.seqbox { border: 1px solid var(--rule-strong); border-radius: 6px; padding: 8px 10px; font: 12px/1.5 var(--mono); resize: vertical;
  min-height: 190px; width: 100%; color: var(--ink); white-space: pre; overflow: auto; }
textarea.seqbox:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent-2); }
.fields { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; align-items: center; }
.fields label { color: var(--muted); }
.fields input, .fields select { border: 1px solid var(--rule-strong); border-radius: 5px; padding: 4px 7px; background: #fff; min-width: 0; }
.massout { min-height: 0; overflow: auto; padding: 0 22px 40px; }
.masshead { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; position: sticky; top: 0; background: #fff; z-index: 2; border-bottom: 1px solid var(--rule-strong); }
.masshead .grow { flex: 1; }
.mres { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(300px, 1.4fr); gap: 6px 24px; padding: 14px 0 16px; border-bottom: 1px solid var(--rule); }
.mres .title { grid-column: 1 / -1; display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.mres .title b { font-weight: 600; white-space: nowrap; }
.mres .title span { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.mres .three { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; margin: 0 0 8px; }
.mres dl { display: grid; grid-template-columns: 130px 1fr; gap: 3px 10px; margin: 0 0 10px; }
.mres dt { color: var(--muted); }
.mres dd { margin: 0; font-family: var(--mono); font-size: 12px; }
.mres table { width: auto; }
.mres table td, .mres table th { position: static; padding: 3px 18px 3px 0; font-size: 12px; background: none; }
.mres table td:last-child { font-family: var(--mono); text-align: right; padding-right: 0; }
.mres .struct { border: 1px solid var(--rule); border-radius: 8px; min-height: 150px; display: flex; align-items: center; justify-content: center; background: #fff; align-self: start; }
.mres .struct img { width: 100%; display: block; }
.mres.bad { grid-template-columns: 1fr; }
.mempty { color: var(--muted); padding: 40px 0; max-width: 520px; }

/* paste sequences */
.modal.wide { width: min(1180px, 96vw); max-height: 90vh; display: flex; flex-direction: column; }
.pgrid { display: grid; grid-template-columns: minmax(260px, 2fr) 3fr; gap: 14px; min-height: 0; flex: 1; }
.pgrid textarea.seqbox { height: 46vh; resize: none; }
.pprev { border: 1px solid var(--rule); border-radius: 6px; overflow: auto; height: 46vh; }
.pprev table td, .pprev table th { padding: 4px 8px; font-size: 12px; }
.pprev td.n { white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.pprev td.s { font-family: var(--mono); font-size: 11.5px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pprev td.e { color: var(--bad); }
.pprev td.g { color: var(--faint); }
.pbar { display: flex; gap: 14px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.pbar label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
.pbar select { border: 1px solid var(--rule-strong); border-radius: 5px; background: #fff; padding: 3px 6px; }
.pbar .grow { flex: 1; }
.or { color: var(--faint); margin: 0 10px; }

/* popover, modal, toast */
.pop { position: fixed; z-index: 20; background: #fff; border: 1px solid var(--rule-strong); border-radius: 10px; box-shadow: 0 12px 32px rgba(10,20,30,.16);
       width: 420px; max-height: 70vh; display: flex; flex-direction: column; }
.pop .body { overflow: auto; padding: 12px 14px; }
.pop .foot { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 14px; border-top: 1px solid var(--rule); align-items: center; }
.pop .foot input { flex: 1; border: 1px solid var(--rule); border-radius: 5px; padding: 4px 7px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.pop h5 { margin: 12px 0 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.pop label { display: flex; gap: 8px; padding: 3px 0; align-items: baseline; }
.pop label small { color: var(--faint); }
.pop .codes { columns: 2; column-gap: 14px; }
.pop .codes label { break-inside: avoid; font-size: 12px; }
.pop .codes label span { font-family: var(--mono); }
.veil { position: fixed; inset: 0; background: rgba(20,25,30,.28); z-index: 30; display: flex; align-items: center; justify-content: center; }
.modal { background: #fff; border-radius: 12px; width: min(460px, 92vw); padding: 20px 22px 16px; box-shadow: 0 20px 50px rgba(0,0,0,.22); }
.modal h3 { margin: 0 0 8px; font-size: 15px; }
.modal p { color: var(--muted); margin: 0 0 16px; white-space: pre-wrap; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px;
         font-size: 12.5px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 40; max-width: 70vw; }
#toast.on { opacity: 1; }
iframe { border: 0; flex: 1; width: 100%; }
.hidden { display: none !important; }
body.dropping::after { content: 'Drop the data folder to open it'; position: fixed; inset: 10px; border: 2px dashed var(--accent-2); border-radius: 14px;
  background: rgba(233,239,247,.88); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; color: var(--accent); z-index: 50; pointer-events: none; }
#updateNote { font-size: 12px; padding-bottom: 10px; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <div class="brand">MS Report</div>
  <div class="folder" id="folderBox"></div>
  <button class="link hidden" id="updateNote"></button>
  <nav id="tabs" class="nofolder">
    <button data-tab="home">Start</button>
    <button data-tab="samples">Samples<span class="count" id="tabSamplesCount"></span><span id="dirtyDot"></span></button>
    <button data-tab="run">Run</button>
    <button data-tab="results">Results<span class="count" id="tabResultsCount"></span></button>
    <button data-tab="mass">Mass calculator</button>
    <button data-tab="blocks">Building blocks</button>
    <button data-tab="help">Help</button>
  </nav>
</header>
<main>
  <section class="page" id="page-home"></section>
  <section class="page" id="page-samples"></section>
  <section class="page" id="page-run"></section>
  <section class="page" id="page-results"></section>
  <section class="page" id="page-mass"></section>
  <section class="page" id="page-blocks"></section>
  <section class="page" id="page-help"></section>
</main>
<div id="toast"></div>

<script>
const TOKEN = '__TOKEN__';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const S = {folder: null, info: null, rows: [], extra: [], mtime: null, dirty: false, val: [], sel: new Set(), lastSel: null,
           filter: '', view: 'all', allCols: false, results: null, resFilter: 'all', resSort: null, resOpen: null,
           deltas: null, tab: 'samples', blocks: null, bval: [], bFilter: '', bKind: 'all', bDirty: false,
           state: null, runOpt: 'all', polling: false, logSince: 0, log: []};
let KEY = 0;

async function api(name, body = {}) {
  if (S.folder && !('folder' in body)) body.folder = S.folder;
  try {
    const r = await fetch('/api/' + name, {method: 'POST', headers: {'X-Token': TOKEN, 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    return await r.json();
  } catch (e) { return {ok: false, error: 'The dashboard stopped responding. Close the window and open MS Report again.'}; }
}
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }
function ask(title, text, buttons) {
  return new Promise(res => {
    const v = document.createElement('div'); v.className = 'veil';
    v.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row">${
      buttons.map((b, i) => `<button class="btn ${b.primary ? 'primary' : ''} ${b.danger ? 'danger' : ''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    document.body.appendChild(v);
    v.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { v.remove(); res(buttons[+b.dataset.i].value); } });
    const p = v.querySelector('.btn.primary') || v.querySelector('.btn'); p && p.focus();
  });
}
const showError = (msg) => ask('Something needs fixing', msg, [{label: 'OK', value: true, primary: true}]);
const fileUrl = p => `/file?t=${encodeURIComponent(TOKEN)}&path=${encodeURIComponent(p)}`;
const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + 's')}`;

/* ------------------------------------------------------------------ tabs */
const NO_FOLDER_TABS = ['mass', 'help'];
function setTab(t) {
  S.tab = t;
  const page = S.folder || NO_FOLDER_TABS.includes(t) ? t : 'home';
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === page));
  $$('.page').forEach(p => p.classList.toggle('on', p.id === 'page-' + page));
  if (page === 'mass') renderMass();
  if (page === 'help') renderHelp();
  if (!S.folder) return;
  if (t === 'samples' && $('#samplesTable')) renderTable();
  if (t === 'run') renderRun();
  if (t === 'results') loadResults();
  if (t === 'blocks' && !S.blocks) loadBlocks();
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); });

function renderHeader() {
  const fb = $('#folderBox');
  $('#tabs').classList.toggle('nofolder', !S.folder);
  if (!S.folder) { fb.innerHTML = ''; return; }
  fb.innerHTML = `<b title="${esc(S.folder)}">${esc(S.info.name)}</b><span title="${esc(S.info.parent)}">${esc(S.info.parent)}</span>

  if (f === 'role') return o('sample', 'sample', value || 'sample') + o('blank', 'blank', value) + (value && !['sample', 'blank', ''].includes(value) ? o(value, value, value) : '');
  if (f === 'raw_file' || f === 'hplc_file') {

document.addEventListener('paste', e => {

  const lines = text.split('\n'); while (lines.length && !lines[lines.length - 1].trim()) lines.pop();

    let row = targets[n];
    if (!row) {   // more lines than rows: new rows go above the blank rows
      row = newRow(); const fb = S.rows.findIndex(r => (r.role || 'sample') === 'blank');
      if (fb >= 0) S.rows.splice(fb, 0, row); else S.rows.push(row); added++;
    }
    line.split('\t').forEach((cell, c) => { const f = fields[f0 + c]; if (f) row[f] = cell.trim(); });
  });
  markDirty(); S.val = []; renderTable(); validate();
  toast(`Pasted ${plural(lines.length, 'line')}${added ? `, ${added} new row${added > 1 ? 's' : ''} added` : ''}`);
});

function newRow() {
  const nums = S.rows.map(r => parseInt(r.id, 10)).filter(n => !isNaN(n));
  const blanks = S.rows.filter(r => (r.role || 'sample') !== 'blank').map(r => r.blank_file).filter(Boolean);
  const blank = blanks.length ? blanks.sort((a, b) => blanks.filter(x => x === b).length - blanks.filter(x => x === a).length)[0] : (S.info.blank_guess || [''])[0] || '';
  const tops = S.rows.map(r => r.topology).filter(t => ['head-to-tail', 'linear'].includes(t));
  const topology = tops.length ? tops.sort((a, b) => tops.filter(x => x === b).length - tops.filter(x => x === a).length)[0] : '';
  const r = {_k: ++KEY, id: String(nums.length ? Math.max(...nums) + 1 : S.rows.length + 1), name: '', sequence: '', topology, bridges: '', raw_file: '', blank_file: blank,
    hplc_file: '', role: 'sample', find_deltas: 'auto', observed_mz: '', notes: ''};
  S.extra.forEach(c => r[c] = '');
  return r;
}
function addRow() {
  const firstBlank = S.rows.findIndex(r => (r.role || 'sample') === 'blank');
  const r = newRow();
  if (firstBlank >= 0) S.rows.splice(firstBlank, 0, r); else S.rows.push(r);
  S.val = []; S.view = 'all'; S.filter = '';
  markDirty(); renderSamples(); validate();
  const tr = $(`#samplesTable tr[data-i="${S.rows.indexOf(r)}"]`);

}

/* ------------------------------------------------------------------ interactive plots */
function niceTicks(a, b, n = 6) {
  const span = b - a; if (!(span > 0)) return [a];

  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag, out = [];
  for (let v = Math.ceil(a / step) * step; v <= b + step * 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
/* A zoomable line/stick plot on a canvas. Drag sideways to zoom, double-click to reset, click to pick. */

}

async function mountPlots(r) {

    if (!$('#plots') || S.resOpen !== id) return;
    if (!T.ok) { box.querySelector('.pnote').textContent = T.error; return; }

  }
  const sr = S.rows.find(x => x.id === id);

    vlines: [{x: lineRt, color: '#c00000'}, {x: PLOTS.rt[id], color: '#0b4a8f', dash: [4, 3]}],

function bDirty() { S.bDirty = true; const b = $('#bSave'); if (b) b.disabled = false; }
document.addEventListener('input', e => { const el = e.target; if (!el.matches('#bBody .cell')) return; S.blocks.rows[+el.closest('tr').dataset.i][el.dataset.b] = el.value; bDirty(); checkSoon(); });
document.addEventListener('change', e => { const el = e.target; if (!el.matches('#bBody select.cell')) return; S.blocks.rows[+el.closest('tr').dataset.i][el.dataset.b] = el.value; bDirty(); checkBlocks(); });
document.addEventListener('click', e => { const d = e.target.closest('[data-del]'); if (!d) return; S.blocks.rows.splice(+d.dataset.del, 1); S.bval = []; bDirty(); paintBlockRows(); checkBlocks(); });
let bTimer = null, bSeq = 0;
function checkSoon() { clearTimeout(bTimer); bTimer = setTimeout(checkBlocks, 300); }
async function checkBlocks() {
  const my = ++bSeq;
  const r = await api('blocks_check', {rows: S.blocks.rows.map(({_k, ...x}) => x)});
  if (my !== bSeq || !r.ok) return;
  S.bval = r.results;
  $$('#bBody tr[data-i]').forEach(tr => paintBlockRow(+tr.dataset.i));
}
async function saveBlocks(force = false) {
  if (!S.blocks || !S.bDirty) return;
  const r = await api('blocks_save', {rows: S.blocks.rows.map(({_k, ...x}) => x), columns: S.blocks.columns, mtime: S.blocks.mtime, force});
  if (r.conflict) {
    const v = await ask('File changed on disk', r.error, [{label: 'Cancel', value: false}, {label: 'Overwrite', value: true, primary: true}]);
    if (v) saveBlocks(true); return;
  }
  if (!r.ok) { showError(r.error); return; }
  S.blocks.mtime = r.mtime; S.bDirty = false; $('#bSave').disabled = true; S.deltas = null;
  toast('Saved building_blocks.csv'); validate();
}

/* ------------------------------------------------------------------ paste sequences */
const normName = x => String(x || '').toLowerCase().replace(/\.(raw|mzml)$/, '').replace(/[^a-z0-9]/g, '');
function nameScore(name, other) {   // how well a pasted name fits a raw file / row name
  const n = normName(name), m = normName(other);
  if (!n || !m) return 0;
  if (n === m) return 3;
  if (/^\d+$/.test(n)) { const t = m.match(/(\d+)$/); return t && +t[1] === +n ? 2 : 0; }
  return n.length >= 3 && (m.includes(n) || (m.length >= 3 && n.includes(m))) ? 1 : 0;
}
function planPaste(items, mode) {   // for each pasted line: the row it fills, or the raw file its new row gets
  const isBlank = r => (r.role || 'sample') === 'blank';
  const blankGuess = new Set(S.info.blank_guess || []);
  const targets = S.rows.filter(r => !isBlank(r) && !String(r.sequence || '').trim());
  const held = new Set(S.rows.map(r => r.raw_file).filter(Boolean));
  const free = (S.info.raw_files || []).filter(f => !held.has(f) && !blankGuess.has(f));
  const usedT = new Set(), usedF = new Set();
  const best = (list, used, score) => { let b = null, bs = 0; list.forEach(x => { if (used.has(x)) return; const v = score(x); if (v > bs) { b = x; bs = v; } }); return b; };
  return items.map(it => {
    let row = null, raw = '';
    if (mode === 'name') {
      row = best(targets, usedT, r => Math.max(nameScore(it.name, r.raw_file), nameScore(it.name, r.name), nameScore(it.name, r.id)));
      if (!row) raw = best(free, usedF, f => nameScore(it.name, f)) || '';
    } else {
      row = targets.find(r => !usedT.has(r)) || null;
      if (!row) raw = free.find(f => !usedF.has(f)) || '';
    }
    if (row) { usedT.add(row); raw = row.raw_file || ''; } else if (raw) usedF.add(raw);
    return {row, raw};
  });
}
function openPaste() {
  const tops = S.rows.map(r => r.topology).filter(Boolean);
  const top0 = tops.length && tops.filter(t => t === 'head-to-tail').length > tops.length / 2 ? 'head-to-tail' : 'linear';
  const v = document.createElement('div'); v.className = 'veil';
  v.innerHTML = `<div class="modal wide" role="dialog" aria-modal="true"><h3>Paste sequences</h3>
    <p>One sequence per line, or rows copied straight from Excel or Word: name and sequence, or a batch sheet with one residue per cell. ${S.rows.some(r => (r.role || 'sample') !== 'blank' && !String(r.sequence || '').trim()) ? 'Rows that have no sequence yet are filled first; the rest become new rows.' : 'Each line becomes a row.'}</p>
    <div class="pgrid"><textarea class="seqbox" id="pText" spellcheck="false" placeholder="Ac-KGG-NH2&#10;Peptide 2&#9;RMNEILDFIDPRFISNDP&#10;H-Ala-Gly-Lys(Biotin)-NH2"></textarea>
      <div class="pprev" id="pPrev"></div></div>
    <div class="pbar">
      <label title="Sequences with their ends written (Ac-…-NH2) are always linear">Topology <select id="pTop"><option${top0 === 'linear' ? ' selected' : ''}>linear</option><option${top0 === 'head-to-tail' ? ' selected' : ''}>head-to-tail</option></select></label>
      <label title="In order: first line with the first raw file. By name: the name on the line against the raw file names.">Match raw files <select id="pMatch"><option value="order">in order</option><option value="name">by name</option></select></label>
      <span class="note" id="pNote"></span><div class="grow"></div>
      <button class="btn" id="pCancel">Cancel</button><button class="btn primary" id="pAdd" disabled>Add</button>
    </div></div>`;
  document.body.appendChild(v);
  let items = [], ignored = 0, seq = 0, timer = null, touchedMatch = false;
  const close = () => { v.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  const paint = () => {
    const mode = $('#pMatch', v).value, plan = planPaste(items, mode);
    const bad = items.filter(i => i.error).length, matched = plan.filter(x => x.raw).length;
    const sheet = items.some(i => i.sheet != null);
    $('#pPrev', v).innerHTML = items.length ? `<table><thead><tr><th class="r">#</th><th>Name</th><th>Sequence</th><th class="r">M (mono)</th>${sheet ? '<th title="A mass found on the pasted line. When the sequence has no ends written, it decides between free acid, C-terminal amide and head-to-tail.">Mass on the sheet</th>' : ''}<th>Raw file</th></tr></thead><tbody>${
      items.map((it, k) => `<tr><td class="num" style="padding-top:4px">${k + 1}</td><td class="n">${esc(it.name)}</td><td class="s" title="${esc(it.sequence)}">${esc(it.sequence)}</td>${
        it.error ? `<td class="e" colspan="1" title="${esc(it.error)}">${esc(it.error)}</td>` : `<td class="r mono">${it.mass.toFixed(4)}</td>`}${sheet ? `<td class="${it.sheet_bad ? 'e' : it.sheet == null ? 'g' : ''}" style="white-space:nowrap">${it.sheet != null ? `${it.sheet.toFixed(4)} ${esc(it.sheet_note)}` : ''}</td>` : ''}<td class="${plan[k].raw ? '' : 'g'}">${esc(plan[k].raw || 'none')}</td></tr>`).join('')}</tbody></table>`
      : '<p class="note" style="padding:14px">The sequences appear here with their masses as you paste or type.</p>';
    $('#pNote', v).textContent = items.length ? `${plural(items.length, 'sequence')}, ${matched} with a raw file${bad ? `, ${bad} to fix` : ''}${items.filter(i => i.sheet_bad).length ? `, ${items.filter(i => i.sheet_bad).length} not matching the sheet's mass` : ''}${ignored ? `; ${plural(ignored, 'line')} without a sequence left out` : ''}` : (ignored ? `${plural(ignored, 'line')} without a sequence left out` : '');
    const b = $('#pAdd', v); b.disabled = !items.length; b.textContent = items.length ? `Add ${plural(items.length, 'sequence')}` : 'Add';
  };
  const parse = async () => {
    const my = ++seq, r = await api('parse_sequences', {text: $('#pText', v).value, topology: $('#pTop', v).value});
    if (my !== seq || !v.isConnected) return;
    if (!r.ok) { toast(r.error, 5000); return; }
    items = r.rows; ignored = r.ignored || 0;
    if (!touchedMatch) {   // by name when the names fit the files better than chance
      const byName = planPaste(items, 'name').filter(x => x.raw).length;
      $('#pMatch', v).value = items.length && byName >= Math.max(1, items.length / 2) ? 'name' : 'order';
    }
    paint();
  };
  $('#pText', v).oninput = () => { clearTimeout(timer); timer = setTimeout(parse, 250); };
  $('#pTop', v).onchange = parse;
  $('#pMatch', v).onchange = () => { touchedMatch = true; paint(); };
  $('#pCancel', v).onclick = close;
  $('#pAdd', v).onclick = async () => { const mode = $('#pMatch', v).value; close(); await applyPaste(items, mode); };
  paint();
  $('#pText', v).focus();
}
async function applyPaste(items, mode) {
  const plan = planPaste(items, mode), wasNew = !S.info.has_samples;
  let added = 0, filled = 0;
  items.forEach((it, k) => {
    let r = plan[k].row;
    if (r) filled++;
    else {
      r = newRow(); r.raw_file = plan[k].raw; added++;
      const fb = S.rows.findIndex(x => (x.role || 'sample') === 'blank');
      if (fb >= 0) S.rows.splice(fb, 0, r); else S.rows.push(r);
    }
    r.sequence = it.sequence; r.topology = it.topology;
    if (/^\d+$/.test(it.name || '')) {   // a row number from the sheet is the id, not the title
      if (!plan[k].row && !S.rows.some(x => x !== r && x.id === it.name)) r.id = it.name;
      if (!r.name || !plan[k].row) r.name = r.raw_file ? r.raw_file.replace(/\.[^.]+$/, '').replace(/_/g, ' ') : `Peptide ${r.id}`;
    } else if (it.name) r.name = it.name;
    else if (!r.name) r.name = r.raw_file ? r.raw_file.replace(/\.[^.]+$/, '').replace(/_/g, ' ') : `Peptide ${r.id}`;
  });
  if (wasNew) {   // a new folder: the blank runs get their rows too
    (S.info.blank_guess || []).forEach((f, n) => {
      const b = newRow();
      Object.assign(b, {id: n ? `blank${n + 1}` : 'blank', name: f.replace(/\.[^.]+$/, '').replace(/_/g, ' '), raw_file: f, role: 'blank', blank_file: '', find_deltas: '', topology: ''});
      S.rows.push(b);
    });
    S.info.has_samples = true; S.dirty = true;
    if (await saveSamples()) await reloadSamples();
    renderHeader();
  } else { S.val = []; S.view = 'all'; S.filter = ''; markDirty(); renderSamples(); validate(); }
  const noRaw = plan.filter(x => !x.raw).length;
  toast(`${plural(items.length, 'sequence')}: ${filled ? `${filled} filled in, ` : ''}${added} new row${added === 1 ? '' : 's'}${noRaw ? `; ${noRaw} without a raw file` : ''}. Check the raw files, then Run.`, 6000);
}

/* ------------------------------------------------------------------ mass calculator */
const M = {text: '', topology: 'linear', bridges: '', z: 4, rows: [], svg: {}, seq: 0, timer: null, error: ''};
try { Object.assign(M, JSON.parse(localStorage.getItem('massCalc') || '{}')); } catch (e) {}
function renderMass() {
  const P = $('#page-mass');
  if ($('#mText', P)) return;
  P.innerHTML = `<div class="masspage">
    <div class="massin">
      <h3>Sequences</h3>
      <textarea class="seqbox" id="mText" spellcheck="false" placeholder="One per line, with or without a name&#10;&#10;Ac-KGG-NH2&#10;thanatin  GSKKPVPIIYCNRRTGKCQRM">${esc(M.text)}</textarea>
      <div class="fields">
        <label for="mTop" title="Sequences with their ends written (Ac-…-NH2) are always linear">Topology</label>
        <select id="mTop"><option${M.topology === 'linear' ? ' selected' : ''}>linear</option><option${M.topology === 'head-to-tail' ? ' selected' : ''}>head-to-tail</option></select>
        <label for="mBridges" title="Side-chain bridges by residue position, for every line: C11-C18 for a disulfide, K3-D7 for a lactam; &quot;disulfide&quot; pairs the only two Cys">Bridges</label>
        <input id="mBridges" value="${esc(M.bridges)}" placeholder="none, or C11-C18" spellcheck="false" autocomplete="off">
        <label for="mZ">Charges up to</label>
        <input id="mZ" type="number" min="1" max="12" value="${+M.z || 4}" style="width:70px">
      </div>
      <p class="note">One letter per residue; other residues in round brackets, (Aib); a side-chain tag in square brackets, K[Biotin]; ends with dashes, Ac-…-NH2. Or three-letter codes: H-Ala-Gly-Lys(Biotin)-NH2, cyclo(-Arg-Gly-Asp-Phe-Val-). A linear peptide without ends written is H-…-OH. Residues and tags come from Building blocks.</p>
    </div>
    <div class="massout" id="mOut"></div></div>`;
  const go = () => { clearTimeout(M.timer); M.timer = setTimeout(calcMass, 250); };
  $('#mText').oninput = go; $('#mBridges').oninput = go; $('#mZ').oninput = go; $('#mTop').onchange = calcMass;
  $('#mOut').addEventListener('click', e => {
    const b = e.target.closest('[data-struct]'); if (b) loadStructure(+b.dataset.struct);
    if (e.target.closest('#mCopy')) copyMassTable();
  });
  calcMass();
}
async function calcMass() {
  Object.assign(M, {text: $('#mText').value, topology: $('#mTop').value, bridges: $('#mBridges').value.trim(), z: Math.max(1, Math.min(12, +$('#mZ').value || 4))});
  try { localStorage.setItem('massCalc', JSON.stringify({text: M.text, topology: M.topology, bridges: M.bridges, z: M.z})); } catch (e) {}
  const my = ++M.seq;
  const r = M.text.trim() ? await api('mass', {text: M.text, topology: M.topology, bridges: M.bridges, max_charge: M.z}) : {ok: true, rows: []};
  if (my !== M.seq) return;
  M.rows = r.ok ? r.rows : []; M.error = r.ok ? '' : r.error;
  paintMass();
  if (M.rows.length <= 6) M.rows.forEach((x, i) => { if (!x.error) loadStructure(i); });
}
const structKey = x => [x.sequence, x.topology, M.bridges].join('|');
function paintMass() {
  const O = $('#mOut'); if (!O) return;
  if (M.error) { O.innerHTML = `<div class="warnbox" style="margin-top:18px">${esc(M.error)}</div>`; return; }
  if (!M.rows.length) { O.innerHTML = '<p class="mempty">Type or paste sequences on the left. Formula, monoisotopic and average mass, m/z for each charge state and the structure appear here. No data folder is needed.</p>'; return; }
  const ok = M.rows.filter(x => !x.error).length;
  O.innerHTML = `<div class="masshead"><h3>${plural(ok, 'peptide')}${ok < M.rows.length ? ` · ${M.rows.length - ok} to fix` : ''}</h3><div class="grow"></div>
      <button class="btn" id="mCopy" ${ok ? '' : 'disabled'} title="Copy every line as a table to paste into Excel">Copy as table</button></div>` +
    M.rows.map((x, i) => x.error
      ? `<div class="mres bad"><div class="title"><b>${esc(x.name || 'Line ' + (i + 1))}</b><span>${esc(x.sequence)}</span></div><div class="errtext">${esc(x.error)}</div></div>`
      : `<div class="mres"><div class="title"><b>${esc(x.name || 'Line ' + (i + 1))}</b><span>${esc(x.one_letter)}</span></div>
          <div><p class="three">${esc(x.three_letter)}</p>
            <dl><dt>Formula</dt><dd>${esc(x.formula)}</dd><dt>Monoisotopic mass</dt><dd>${x.mass.toFixed(4)}</dd>
              <dt>Average mass</dt><dd>${x.average != null ? x.average.toFixed(2) : ''}</dd><dt>Residues</dt><dd>${x.residues}</dd></dl>
            <table><thead><tr><th>Ion</th><th class="r">m/z</th></tr></thead><tbody>${x.ions.map(([l, mz]) => `<tr><td>[${esc(l)}]<sup>${l.includes('H') && /\d/.test(l) ? l.match(/(\d+)H/)[1] : ''}+</sup></td><td>${mz.toFixed(4)}</td></tr>`).join('')}</tbody></table></div>
          <div class="struct" id="mStruct${i}">${M.svg[structKey(x)] ? structImg(M.svg[structKey(x)]) : `<button class="link" data-struct="${i}">Show structure</button>`}</div></div>`).join('');
}
const structImg = svg => `<img alt="Structure" src="data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(svg)))}">`;
async function loadStructure(i) {
  const x = M.rows[i]; if (!x || x.error) return;
  const key = structKey(x), box = () => $('#mStruct' + i);
  if (!M.svg[key]) {
    if (box()) box().innerHTML = '<span class="note">Drawing…</span>';
    const r = await api('structure', {sequence: x.sequence, topology: x.topology, bridges: M.bridges});
    if (!r.ok) { if (box() && M.rows[i] === x) box().innerHTML = `<span class="errtext" style="padding:8px">${esc(r.error)}</span>`; return; }
    M.svg[key] = r.svg;
  }
  if (box() && M.rows[i] === x) box().innerHTML = structImg(M.svg[key]);
}
async function copyMassTable() {
  const good = M.rows.filter(x => !x.error), labels = good.length ? good[0].ions.map(i => `[${i[0]}]`) : [];
  const text = [['Name', 'Sequence', 'Formula', 'Monoisotopic mass', 'Average mass', ...labels].join('\t'),
    ...good.map(x => [x.name, x.one_letter, x.formula, x.mass.toFixed(4), x.average != null ? x.average.toFixed(2) : '', ...x.ions.map(i => i[1].toFixed(4))].join('\t'))].join('\n');
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(`Copied ${plural(good.length, 'row')}; paste into Excel`);
}

/* ------------------------------------------------------------------ help */
function renderHelp() {
  const P = $('#page-help');
  if (!$('iframe', P)) P.innerHTML = `<iframe src="/manual?t=${encodeURIComponent(TOKEN)}" title="MS Report manual"></iframe>`;
}
window.addEventListener('beforeunload', e => { if (S.dirty || S.bDirty) { e.preventDefault(); e.returnValue = ''; } });

/* ------------------------------------------------------------------ start */
(async function start() {
  S.state = await api('state');
  const f = new URLSearchParams(location.search).get('folder');
  if (f) await openFolder(f); else { renderHeader(); renderHome(); }
  setTimeout(async () => {     // a newer version on GitHub?
    const u = await api('update', {folder: undefined});
    if (u.ok && u.newer) { const b = $('#updateNote'); b.textContent = `Version ${u.latest} is available`; b.title = `You have ${u.current}. Click to open the download page.`; b.classList.remove('hidden'); b.onclick = () => api('open_update', {folder: undefined}); }
  }, 4000);
})();
</script>
